[project]
name = "reinforcement-learning"
version = "0.1.0"
description = "Learn-by-building reinforcement learning curriculum with Gymnasium"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pytest>=8.0.0",
    "tensorboard>=2.20.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_tutorial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end training runs (deselect with '-m \"not slow\"')",
]
